version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: jan_samadhan_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: jan_samadhan_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://db:27017
      # Removed the Google variables here to prevent Docker conflicts
    env_file:
      - .env # This will automatically inject everything in your .env file
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: jan_samadhan_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    env_file:
      - .env # Let the frontend access the .env directly too
    depends_on:
      - backend

volumes:
  mongo_data: